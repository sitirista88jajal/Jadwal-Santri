<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Denda Santri</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 flex flex-col items-center">

    <div class="w-full max-w-md bg-slate-800 rounded-3xl shadow-2xl border border-slate-700 p-6 mb-6">
        <h1 class="text-xl font-bold text-center text-purple-400 mb-6">MONITORING DENDA SANTRI</h1>
        
        <div class="mb-6">
            <label class="block text-sm font-semibold text-slate-300 mb-2">📅 Pilih Hari:</label>
            <select id="daySelect" onchange="renderApp()" class="w-full bg-slate-700 border border-slate-600 rounded-xl p-3 text-slate-100">
                <option value="Sabtu">Sabtu</option>
                <option value="Minggu">Minggu</option>
                <option value="Senin">Senin</option>
                <option value="Selasa" selected>Selasa</option>
                <option value="Rabu">Rabu</option>
                <option value="Kamis">Kamis</option>
            </select>
        </div>

        <div id="santriListContainer" class="space-y-4"></div>
    </div>

    <div class="w-full max-w-md bg-slate-800 rounded-3xl p-6 shadow-2xl border border-slate-700">
        <h2 class="text-md font-bold mb-4">📊 Ringkasan Sisa Denda</h2>
        <div id="summaryContainer" class="space-y-2"></div>
        <button onclick="resetData()" class="w-full mt-4 text-xs text-red-400 hover:underline">Reset Semua Data</button>
    </div>

    <script>
        const jadwal = {
            "Sabtu": ["Sabil", "Fatir", "Hafid"],
            "Minggu": ["Ale", "Noval", "Alif"],
            "Senin": ["Ihab", "Aswad", "Adit"],
            "Selasa": ["Rehan", "Tohir"],
            "Rabu": ["Maman", "Samsul"],
            "Kamis": ["Ikrom", "Trisno", "Aris"]
        };

        let db = JSON.parse(localStorage.getItem('denda_app')) || {};
        Object.values(jadwal).flat().forEach(n => { if(!db[n]) db[n] = {ja:0, so:0, di:0}; });

        function renderApp() {
            const day = document.getElementById('daySelect').value;
            const container = document.getElementById('santriListContainer');
            container.innerHTML = '';
            
            jadwal[day].forEach(n => {
                const sisa = ((db[n].ja + db[n].so) * 3000) - db[n].di;
                container.innerHTML += `
                    <div class="bg-slate-700 p-4 rounded-xl border border-slate-600">
                        <div class="flex justify-between mb-2">
                            <span class="font-bold">${n}</span>
                            <span class="text-purple-300 font-bold">Sisa: Rp${sisa.toLocaleString()}</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2 mb-3 text-[10px]">
                            <button onclick="update('${n}','ja',1)" class="bg-rose-900 p-2 rounded">Tak Jama'ah (${db[n].ja}x)</button>
                            <button onclick="update('${n}','so',1)" class="bg-rose-900 p-2 rounded">Tak Sorogan (${db[n].so}x)</button>
                        </div>
                        <div class="flex gap-2">
                            <input type="number" id="pay_${n}" class="w-full bg-slate-900 rounded p-1 text-xs" placeholder="Bayar...">
                            <button onclick="bayar('${n}')" class="bg-emerald-600 px-3 rounded text-xs">Bayar</button>
                        </div>
                    </div>
                `;
            });
            renderSummary();
        }

        function update(n, t, v) { t === 'ja' ? db[n].ja += v : db[n].so += v; save(); renderApp(); }
        function bayar(n) { const val = parseInt(document.getElementById('pay_'+n).value); if(val) { db[n].di += val; save(); renderApp(); } }
        function save() { localStorage.setItem('denda_app', JSON.stringify(db)); }
        
        function renderSummary() {
            const cont = document.getElementById('summaryContainer'); cont.innerHTML = '';
            Object.keys(db).forEach(n => {
                const sisa = ((db[n].ja + db[n].so) * 3000) - db[n].di;
                if(sisa > 0) cont.innerHTML += `<div class="flex justify-between text-xs bg-slate-900 p-2 rounded">${n} <span>Rp${sisa.toLocaleString()}</span></div>`;
            });
        }
        function resetData() { if(confirm("Hapus semua?")) { localStorage.removeItem('denda_app'); location.reload(); } }
        renderApp();
    </script>
</body>
</html>
