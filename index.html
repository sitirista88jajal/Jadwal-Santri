<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absensi Santri Al-Mu'awanah</title>

<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<style>
body{
    font-family:Arial,sans-serif;
}
button{
    cursor:pointer;
}
</style>
</head>

<body class="bg-slate-950 text-white min-h-screen p-3">

<div class="max-w-md mx-auto bg-slate-900 rounded-3xl p-4 shadow-xl">

<!-- HEADER -->
<div class="text-center mb-5">

    <button onclick="bukaKelola()"
        class="float-right bg-slate-800 text-emerald-400 px-3 py-2 rounded-xl text-xs">
        ⚙️ Santri
    </button>

    <div class="clear-both pt-3">

        <div class="w-20 h-20 bg-white rounded-full mx-auto mb-3 p-1">
            <img src="1000302681.png"
                 class="w-full h-full object-contain"
                 onerror="this.style.display='none'">
        </div>

        <div class="text-emerald-400 text-xs font-bold">
            PONDOK PESANTREN
        </div>

        <h1 class="text-xl font-bold text-emerald-400">
            AL-MU'AWANAH
        </h1>

        <div class="text-xs text-emerald-500">
            SUKAMANDI
        </div>

        <p class="text-xs text-slate-400 mt-1">
            Absensi, Pelanggaran & Denda Santri
        </p>
    </div>
</div>


<!-- MENU -->
<div class="grid grid-cols-4 gap-1 bg-slate-950 p-1 rounded-xl mb-5">

    <button id="tab-piket"
        onclick="tab('piket')"
        class="tab aktif">
        Piket
    </button>

    <button id="tab-isya"
        onclick="tab('isya')"
        class="tab">
        Isya'
    </button>

    <button id="tab-denda"
        onclick="tab('denda')"
        class="tab relative">
        Denda
        <span id="badgeDenda"
            class="hidden absolute -top-1 -right-1 bg-red-600 text-white text-[9px] w-5 h-5 rounded-full">
        </span>
    </button>

    <button id="tab-rekap"
        onclick="tab('rekap')"
        class="tab">
        Rekap
    </button>

</div>


<!-- ================= PIKET ================= -->

<section id="piket">

    <label class="text-xs text-slate-400">
        Hari Piket
    </label>

    <select id="hari"
        onchange="render()"
        class="w-full mt-1 mb-4 p-3 rounded-xl bg-slate-950 border border-slate-700">
    </select>

    <div id="listPiket"></div>

</section>


<!-- ================= ISYA ================= -->

<section id="isya" class="hidden">

    <input id="cari"
        oninput="renderIsya()"
        placeholder="🔍 Cari nama santri..."
        class="w-full p-3 rounded-xl bg-slate-950 border border-slate-700 mb-4">

    <div class="flex justify-between mb-3">
        <b class="text-sm">Pengajian Ba'da Isya</b>
        <span id="jumlahSantri"
            class="text-xs text-emerald-400">
        </span>
    </div>

    <div id="listIsya"></div>

</section>


<!-- ================= DENDA ================= -->

<section id="denda" class="hidden">

    <div class="flex justify-between items-center mb-4">
        <b>Denda Berjalan</b>

        <span id="jumlahDenda"
            class="text-xs bg-red-950 text-red-300 px-3 py-1 rounded-full">
            0 Aktif
        </span>
    </div>

    <div id="listDenda"></div>

</section>


<!-- ================= REKAP ================= -->

<section id="rekap" class="hidden">

    <h3 class="font-bold mb-3">
        📊 Rekap Denda
    </h3>

    <div id="listRekap"></div>

    <div class="bg-slate-950 rounded-2xl p-4 mt-4">

        <div class="flex justify-between text-sm">
            <span>Total Denda</span>
            <b id="totalDenda" class="text-red-400">
                Rp0
            </b>
        </div>

        <div class="flex justify-between text-sm mt-2">
            <span>Total Dibayar</span>
            <b id="totalBayar" class="text-emerald-400">
                Rp0
            </b>
        </div>

        <div class="flex justify-between text-sm mt-2">
            <span>Total Sisa</span>
            <b id="totalSisa" class="text-yellow-400">
                Rp0
            </b>
        </div>

    </div>

    <button onclick="resetData()"
        class="w-full mt-5 p-3 rounded-xl bg-red-950 text-red-400 text-xs">
        ⚠️ Reset Semua Data
    </button>

</section>

</div>


<!-- ================= MODAL SANTRI ================= -->

<div id="modalSantri"
    class="hidden fixed inset-0 bg-black/80 p-4 z-50">

<div class="max-w-md mx-auto bg-slate-900 rounded-2xl p-4">

    <div class="flex justify-between mb-4">
        <b>⚙️ Kelola Santri</b>

        <button onclick="tutupKelola()">
            ✕
        </button>
    </div>

    <input id="namaBaru"
        placeholder="Nama santri"
        class="w-full p-3 rounded-xl bg-slate-950 border border-slate-700 mb-2">

    <div class="flex gap-2">

        <select id="hariBaru"
            class="flex-1 p-3 rounded-xl bg-slate-950 border border-slate-700">

            <option value="Non-Piket">
                Non-Piket
            </option>

            <option>Sabtu</option>
            <option>Minggu</option>
            <option>Senin</option>
            <option>Selasa</option>
            <option>Rabu</option>
            <option>Kamis</option>

        </select>

        <button onclick="tambahSantri()"
            class="bg-emerald-600 px-4 rounded-xl font-bold">
            +
        </button>

    </div>

    <div class="border-t border-slate-700 my-4"></div>

    <div id="daftarKelola"></div>

</div>
</div>


<script>

/* =========================================================
   DATA BAWAAN
   ========================================================= */

const jadwalBawaan = {
    "Sabtu":["Sabil","Fatir","Hafid"],
    "Minggu":["Ale","Noval","Alif"],
    "Senin":["Ihab","Aswad","Adit"],
    "Selasa":["Rehan","Tohir"],
    "Rabu":["Maman","Samsul"],
    "Kamis":["Ikrom","Trisno","Aris"]
};

const santriTambahanBawaan = [
    "Bagio",
    "Syarif"
];

const TARIF_PIKET = 3000;
const TARIF_ISYA = 5000;


/* =========================================================
   MEMBACA DATA LAMA
   JANGAN DIUBAH KEY-NYA
   ========================================================= */

let jadwal =
    JSON.parse(localStorage.getItem("jadwal_app"))
    || structuredClone(jadwalBawaan);

let santriTambahan =
    JSON.parse(localStorage.getItem("santri_tambahan_app"))
    || [...santriTambahanBawaan];

let db =
    JSON.parse(localStorage.getItem("denda_app"))
    || {};


/* =========================================================
   SIMPAN DATA
   ========================================================= */

function save(){

    localStorage.setItem(
        "jadwal_app",
        JSON.stringify(jadwal)
    );

    localStorage.setItem(
        "santri_tambahan_app",
        JSON.stringify(santriTambahan)
    );

    localStorage.setItem(
        "denda_app",
        JSON.stringify(db)
    );
}


/* =========================================================
   SEMUA SANTRI
   ========================================================= */

function semuaSantri(){

    return [
        ...Object.values(jadwal).flat(),
        ...santriTambahan
    ]
    .filter((v,i,a)=>a.indexOf(v)===i)
    .sort();
}


/* =========================================================
   PASTIKAN DATA LAMA TIDAK RUSAK
   ========================================================= */

function sinkronkan(){

    semuaSantri().forEach(n=>{

        if(!db[n]){
            db[n] = {
                ja:0,
                so:0,
                di:0,
                ap:0,
                tp:0,
                sd:0,
                bt:0
            };
        }

        /*
        Data lama mungkin belum memiliki
        beberapa kolom. Kita tambahkan hanya
        jika belum ada.
        */

        const d = db[n];

        if(d.ja === undefined) d.ja = 0;
        if(d.so === undefined) d.so = 0;
        if(d.di === undefined) d.di = 0;
        if(d.ap === undefined) d.ap = 0;
        if(d.tp === undefined) d.tp = 0;
        if(d.sd === undefined) d.sd = 0;
        if(d.bt === undefined) d.bt = 0;

    });

    save();
}

sinkronkan();


/* =========================================================
   FORMAT RUPIAH
   ========================================================= */

function rupiah(n){

    return "Rp" + Number(n || 0)
        .toLocaleString("id-ID");
}


/* =========================================================
   TOTAL DENDA OTOMATIS
   ========================================================= */

function totalDenda(n){

    const d = db[n];

    /*
    Piket:
    Jamaah × 3.000
    Sorogan × 3.000

    Isya:
    sd = sanksi denda yang sudah dipilih
    */

    return (
        (d.ja * TARIF_PIKET) +
        (d.so * TARIF_PIKET) +
        (d.sd || 0)
    );
}


/* =========================================================
   TOTAL BAYAR
   ========================================================= */

function totalBayar(n){

    return db[n].di || 0;
}


/* =========================================================
   SISA DENDA OTOMATIS
   ========================================================= */

function sisaDenda(n){

    return Math.max(
        0,
        totalDenda(n) - totalBayar(n)
    );
}


/* =========================================================
   STATUS SANKSI ISYA
   ========================================================= */

function statusIsya(n){

    const d = db[n];

    const pelanggaran =
        (d.ap || 0) +
        (d.tp || 0);

    const wajib =
        Math.floor(pelanggaran / 5);

    const selesaiDenda =
        Math.floor(
            (d.sd || 0) / TARIF_ISYA
        );

    const selesaiBotak =
        d.bt || 0;

    const selesai =
        selesaiDenda + selesaiBotak;

    return {
        pelanggaran,
        wajib,
        sisa:Math.max(
            0,
            wajib - selesai
        )
    };
}


/* =========================================================
   TAB
   ========================================================= */

function tab(nama){

    ["piket","isya","denda","rekap"]
    .forEach(id=>{

        document.getElementById(id)
            .classList.toggle(
                "hidden",
                id !== nama
            );

        const btn =
            document.getElementById(
                "tab-" + id
            );

        btn.className =
            id === nama
            ? "tab aktif"
            : "tab";

    });

    render();
}


/* =========================================================
   STYLE TAB
   ========================================================= */

document.head.insertAdjacentHTML(
    "beforeend",
    `
    <style>
    .tab{
        padding:10px 2px;
        border-radius:10px;
        font-size:11px;
        font-weight:bold;
        color:#94a3b8;
    }

    .tab.aktif{
        background:#059669;
        color:white;
    }
    </style>
    `
);


/* =========================================================
   RENDER UTAMA
   ========================================================= */

function render(){

    renderHari();
    renderPiket();
    renderIsya();
    renderDenda();
    renderRekap();

}


/* =========================================================
   PILIHAN HARI
   ========================================================= */

function renderHari(){

    const select =
        document.getElementById("hari");

    const hariSaatIni =
        select.value || "Selasa";

    select.innerHTML = "";

    Object.keys(jadwal).forEach(h=>{

        const option =
            document.createElement("option");

        option.value = h;
        option.textContent = h;

        if(h === hariSaatIni)
            option.selected = true;

        select.appendChild(option);

    });

}


/* =========================================================
   PIKET
   ========================================================= */

function renderPiket(){

    const hari =
        document.getElementById("hari").value;

    const container =
        document.getElementById("listPiket");

    container.innerHTML = "";

    (jadwal[hari] || []).forEach(n=>{

        const d = db[n];

        const sisa = sisaDenda(n);

        container.innerHTML += `

        <div class="bg-slate-950 rounded-2xl p-4 mb-3">

            <div class="flex justify-between mb-3">

                <b>${n}</b>

                <span class="${
                    sisa > 0
                    ? "text-red-400"
                    : "text-emerald-400"
                } text-xs">

                    Sisa ${rupiah(sisa)}

                </span>

            </div>


            <!-- PELANGGARAN -->

            <div class="grid grid-cols-2 gap-2">

                <button
                    onclick="ubahPiket('${n}','ja',1)"
                    class="bg-red-950 p-3 rounded-xl text-xs">

                    ❌ Tak Jamaah
                    <b>${d.ja}x</b>

                </button>

                <button
                    onclick="ubahPiket('${n}','so',1)"
                    class="bg-red-950 p-3 rounded-xl text-xs">

                    ❌ Tak Sorogan
                    <b>${d.so}x</b>

                </button>

            </div>


            <!-- KOREKSI -->

            <div class="flex justify-between mt-2">

                <button
                    onclick="ubahPiket('${n}','ja',-1)"
                    class="text-xs text-slate-400">

                    − Jamaah

                </button>

                <button
                    onclick="ubahPiket('${n}','so',-1)"
                    class="text-xs text-slate-400">

                    − Sorogan

                </button>

            </div>


            <!-- PEMBAYARAN -->

            <div class="flex gap-2 mt-3">

                <input
                    id="bayar_${encodeURIComponent(n)}"
                    type="number"
                    placeholder="Bayar denda"
                    class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 text-sm">

                <button
                    onclick="bayar('${n}')"
                    class="bg-emerald-600 px-4 rounded-xl text-xs font-bold">

                    Bayar

                </button>

            </div>

        </div>
        `;

    });

}


/* =========================================================
   UPDATE PIKET
   ========================================================= */

function ubahPiket(n,param,nilai){

    db[n][param] =
        Math.max(
            0,
            (db[n][param] || 0) + nilai
        );

    save();
    render();
}


/* =========================================================
   ISYA
   ========================================================= */

function renderIsya(){

    const cari =
        document.getElementById("cari")
        .value
        .toLowerCase();

    const container =
        document.getElementById("listIsya");

    container.innerHTML = "";

    let jumlah = 0;

    semuaSantri().forEach(n=>{

        if(
            cari &&
            !n.toLowerCase().includes(cari)
        ) return;

        jumlah++;

        const d = db[n];
        const s = statusIsya(n);

        let pilihanSanksi = "";

        if(s.sisa > 0){

            pilihanSanksi = `

            <div class="bg-red-950 p-3 rounded-xl mt-3">

                <div class="text-red-300 text-xs font-bold mb-2">

                    🚨 ${s.sisa} Sanksi Belum Dipilih

                </div>

                <div class="grid grid-cols-2 gap-2">

                    <button
                        onclick="sanksi('${n}','denda')"
                        class="bg-red-600 p-2 rounded-lg text-xs">

                        Denda Rp5.000

                    </button>

                    <button
                        onclick="sanksi('${n}','botak')"
                        class="bg-yellow-500 text-black p-2 rounded-lg text-xs font-bold">

                        Botak

                    </button>

                </div>

            </div>

            `;
        }

        container.innerHTML += `

        <div class="bg-slate-950 rounded-2xl p-4 mb-3">

            <div class="flex justify-between">

                <div>

                    <b>${n}</b>

                    ${
                        santriTambahan.includes(n)
                        ? `<span class="text-[9px] text-emerald-400 ml-1">
                            Non-Piket
                           </span>`
                        : ""
                    }

                </div>

                <div class="text-right text-xs">

                    <div>
                        Pelanggaran:
                        <b class="text-emerald-400">
                            ${s.pelanggaran}x
                        </b>
                    </div>

                    <div class="text-slate-400">
                        Alpa ${d.ap} |
                        Telat ${d.tp}
                    </div>

                </div>

            </div>


            <div class="grid grid-cols-2 gap-2 mt-3">

                <div class="bg-slate-900 rounded-xl flex justify-between">

                    <span class="text-xs p-2">
                        ❌ Alpa
                    </span>

                    <div>

                        <button
                            onclick="ubahIsya('${n}','ap',-1)"
                            class="px-3 py-2">

                            −

                        </button>

                        <button
                            onclick="ubahIsya('${n}','ap',1)"
                            class="px-3 py-2 bg-red-900 rounded-r-xl">

                            +

                        </button>

                    </div>

                </div>


                <div class="bg-slate-900 rounded-xl flex justify-between">

                    <span class="text-xs p-2">
                        ⏰ Telat
                    </span>

                    <div>

                        <button
                            onclick="ubahIsya('${n}','tp',-1)"
                            class="px-3 py-2">

                            −

                        </button>

                        <button
                            onclick="ubahIsya('${n}','tp',1)"
                            class="px-3 py-2 bg-yellow-900 rounded-r-xl">

                            +

                        </button>

                    </div>

                </div>

            </div>


            <div class="text-xs text-yellow-400 mt-3">

                Sanksi denda aktif:
                ${rupiah(d.sd)}

                ${
                    d.bt > 0
                    ? ` | Botak ${d.bt}x`
                    : ""
                }

            </div>

            ${pilihanSanksi}

        </div>

        `;

    });

    document.getElementById(
        "jumlahSantri"
    ).textContent =
        jumlah + " Santri";

}


/* =========================================================
   UPDATE ISYA
   ========================================================= */

function ubahIsya(n,param,nilai){

    db[n][param] =
        Math.max(
            0,
            (db[n][param] || 0) + nilai
        );

    save();
    render();

}


/* =========================================================
   PILIH SANKSI
   ========================================================= */

function sanksi(n,jenis){

    if(jenis === "denda"){

        db[n].sd =
            (db[n].sd || 0)
            + TARIF_ISYA;

    }

    if(jenis === "botak"){

        db[n].bt =
            (db[n].bt || 0)
            + 1;

    }

    save();
    render();

}


/* =========================================================
   DENDA OTOMATIS
   ========================================================= */

function renderDenda(){

    const container =
        document.getElementById("listDenda");

    container.innerHTML = "";

    let aktif = 0;

    semuaSantri().forEach(n=>{

        const d = db[n];

        /*
        INI BAGIAN PENTING:
        TOTAL DENDA OTOMATIS DIAMBIL
        DARI DATA PELANGGARAN.
        */

        const piketJamaah =
            d.ja * TARIF_PIKET;

        const piketSorogan =
            d.so * TARIF_PIKET;

        const dendaIsya =
            d.sd || 0;

        const total =
            piketJamaah +
            piketSorogan +
            dendaIsya;

        const bayar =
            d.di || 0;

        const sisa =
            Math.max(
                0,
                total - bayar
            );

        if(sisa <= 0 && !(d.bt > 0))
            return;

        aktif++;

        container.innerHTML += `

        <div class="bg-slate-950 rounded-2xl p-4 mb-3">

            <div class="flex justify-between mb-3">

                <b>${n}</b>

                <b class="text-red-400">
                    Sisa ${rupiah(sisa)}
                </b>

            </div>


            <!-- RINCIAN OTOMATIS -->

            <div class="bg-slate-900 rounded-xl p-3 text-xs space-y-2">

                <div class="flex justify-between">

                    <span>
                        Tak Jamaah
                        (${d.ja} × Rp3.000)
                    </span>

                    <b>
                        ${rupiah(piketJamaah)}
                    </b>

                </div>


                <div class="flex justify-between">

                    <span>
                        Tak Sorogan
                        (${d.so} × Rp3.000)
                    </span>

                    <b>
                        ${rupiah(piketSorogan)}
                    </b>

                </div>


                <div class="flex justify-between">

                    <span>
                        Sanksi Isya
                    </span>

                    <b>
                        ${rupiah(dendaIsya)}
                    </b>

                </div>


                <div class="border-t border-slate-700 pt-2 flex justify-between font-bold">

                    <span>
                        TOTAL DENDA
                    </span>

                    <span class="text-red-400">
                        ${rupiah(total)}
                    </span>

                </div>


                <div class="flex justify-between text-emerald-400">

                    <span>
                        Sudah Dibayar
                    </span>

                    <b>
                        ${rupiah(bayar)}
                    </b>

                </div>


                <div class="flex justify-between text-yellow-400 font-bold">

                    <span>
                        SISA
                    </span>

                    <b>
                        ${rupiah(sisa)}
                    </b>

                </div>

            </div>


            ${
                d.bt > 0
                ? `
                <div class="bg-yellow-950 text-yellow-400 p-3 rounded-xl mt-3 text-xs">

                    ✂️ Sanksi Botak:
                    <b>${d.bt}x</b>

                    <button
                        onclick="selesaiBotak('${n}')"
                        class="block mt-2 bg-yellow-500 text-black px-3 py-2 rounded-lg font-bold">

                        Tandai Selesai

                    </button>

                </div>
                `
                : ""
            }


            ${
                sisa > 0
                ? `
                <div class="flex gap-2 mt-3">

                    <input
                        id="bayarDenda_${encodeURIComponent(n)}"
                        type="number"
                        placeholder="Masukkan pembayaran"
                        class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 text-sm">

                    <button
                        onclick="bayarDariDenda('${n}')"
                        class="bg-emerald-600 px-3 rounded-xl text-xs font-bold">

                        Bayar

                    </button>

                </div>
                `
                : ""
            }

        </div>

        `;

    });


    if(!aktif){

        container.innerHTML = `

        <div class="text-center py-10 text-slate-500">

            🎉 Tidak ada denda berjalan.

        </div>

        `;

    }


    document.getElementById(
        "jumlahDenda"
    ).textContent =
        aktif + " Aktif";


    const badge =
        document.getElementById(
            "badgeDenda"
        );

    if(aktif){

        badge.textContent = aktif;
        badge.classList.remove("hidden");

    }else{

        badge.classList.add("hidden");

    }

}


/* =========================================================
   BAYAR DENDA
   ========================================================= */

function bayar(n){

    const input =
        document.getElementById(
            "bayar_" + encodeURIComponent(n)
        );

    prosesBayar(n,input);

}


function bayarDariDenda(n){

    const input =
        document.getElementById(
            "bayarDenda_" +
            encodeURIComponent(n)
        );

    prosesBayar(n,input);

}


function prosesBayar(n,input){

    const jumlah =
        parseInt(input.value);

    if(!jumlah || jumlah <= 0){

        alert("Masukkan jumlah pembayaran.");

        return;

    }


    db[n].di =
        (db[n].di || 0)
        + jumlah;


    save();

    input.value = "";

    render();

}


/* =========================================================
   SELESAI SANKSI BOTAK
   ========================================================= */

function selesaiBotak(n){

    if(db[n].bt > 0){

        db[n].bt--;

        save();
        render();

    }

}


/* =========================================================
   REKAP
   ========================================================= */

function renderRekap(){

    const container =
        document.getElementById("listRekap");

    container.innerHTML = "";

    let total = 0;
    let bayar = 0;
    let sisaSemua = 0;

    semuaSantri().forEach(n=>{

        const d = db[n];

        const t = totalDenda(n);
        const b = totalBayar(n);
        const s = sisaDenda(n);

        total += t;
        bayar += b;
        sisaSemua += s;


        if(t === 0 && b === 0 && d.bt === 0)
            return;


        container.innerHTML += `

        <div class="bg-slate-950 rounded-2xl p-4 mb-3">

            <div class="flex justify-between">

                <b>${n}</b>

                <span class="${
                    s > 0
                    ? "text-red-400"
                    : "text-emerald-400"
                } text-xs font-bold">

                    ${rupiah(s)}

                </span>

            </div>


            <div class="text-xs text-slate-400 mt-2">

                Total Denda:
                <b class="text-white">
                    ${rupiah(t)}
                </b>

                <br>

                Dibayar:
                <b class="text-emerald-400">
                    ${rupiah(b)}
                </b>

            </div>


            <button
                onclick="bagikan('${n}')"
                class="w-full bg-emerald-600 mt-3 p-2 rounded-xl text-xs font-bold">

                💬 Kirim Laporan WhatsApp

            </button>

        </div>

        `;

    });


    document.getElementById(
        "totalDenda"
    ).textContent = rupiah(total);

    document.getElementById(
        "totalBayar"
    ).textContent = rupiah(bayar);

    document.getElementById(
        "totalSisa"
    ).textContent = rupiah(sisaSemua);

}

`*LAPORAN KEDISIPLINAN SANTRI*

/* =========================================================
   KELOLA SANTRI
   ========================================================= */

function bukaKelola(){

    document
        .getElementById("modalSantri")
        .classList.remove("hidden");

    renderKelola();

}


function tutupKelola(){

    document
        .getElementById("modalSantri")
        .classList.add("hidden");

}


function renderKelola(){

    const box =
        document.getElementById(
            "daftarKelola"
        );

    box.innerHTML = "";


    semuaSantri().forEach(n=>{

        let hari = "Non-Piket";

        Object.keys(jadwal).forEach(h=>{

            if(jadwal[h].includes(n))
                hari = h;

        });


        box.innerHTML += `

        <div class="bg-slate-950 p-3 rounded-xl mb-2 flex justify-between items-center">

            <div>

                <b class="text-sm">
                    ${n}
                </b>

                <div class="text-xs text-slate-500">
                    ${hari}
                </div>

            </div>

            <button
                onclick="keluarkan('${n}')"
                class="bg-red-950 text-red-400 px-3 py-2 rounded-lg text-xs">

                Keluarkan

            </button>

        </div>

        `;

    });

}


/* =========================================================
   TAMBAH SANTRI
   ========================================================= */

function tambahSantri(){

    const nama =
        document.getElementById(
            "namaBaru"
        ).value.trim();

    const hari =
        document.getElementById(
            "hariBaru"
        ).value;


    if(!nama){

        alert("Masukkan nama santri.");

        return;

    }


    if(semuaSantri().includes(nama)){

        alert("Nama santri sudah ada.");

        return;

    }


    if(hari === "Non-Piket"){

        santriTambahan.push(nama);

    }else{

        if(!jadwal[hari])
            jadwal[hari] = [];

        jadwal[hari].push(nama);

    }


    db[nama] = {
        ja:0,
        so:0,
        di:0,
        ap:0,
        tp:0,
        sd:0,
        bt:0
    };


    save();

    document.getElementById(
        "namaBaru"
    ).value = "";

    renderKelola();
    render();

}


/* =========================================================
   KELUARKAN SANTRI
   ========================================================= */

function keluarkan(nama){

    const sisa = sisaDenda(nama);


    let pesan =
        "Keluarkan " + nama + "?";


    if(sisa > 0){

        pesan +=
            "\n\nMasih memiliki tunggakan "
            + rupiah(sisa)
            + ".";

    }


    if(!confirm(pesan))
        return;


    Object.keys(jadwal)
    .forEach(h=>{

        jadwal[h] =
            jadwal[h].filter(
                n=>n !== nama
            );

    });


    santriTambahan =
        santriTambahan.filter(
            n=>n !== nama
        );


    /*
    DATA SANTRI YANG DIKELUARKAN
    DIHAPUS DARI DATABASE,
    SAMA SEPERTI SISTEM LAMA.
    */

    delete db[nama];


    save();

    renderKelola();
    render();

}


/* =========================================================
   RESET
   ========================================================= */

function resetData(){

    if(!confirm(
        "PERINGATAN!\n\n" +
        "Semua data absensi, denda, pembayaran " +
        "dan santri akan dihapus.\n\n" +
        "Yakin?"
    ))
        return;


    /*
    HANYA dilakukan jika pengguna
    benar-benar menekan OK.
    */

    localStorage.clear();

    location.reload();

}


/* =========================================================
   MULAI APLIKASI
   ========================================================= */

render();

</script>
